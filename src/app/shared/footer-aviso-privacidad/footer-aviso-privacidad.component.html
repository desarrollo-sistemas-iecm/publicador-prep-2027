<div class="row">
    <div class="col-md-12 px-0">
        <footer class="container-fluid bgMorado txBlanco pie-pagina">
            <div class="row">
                <div class="col-xl-10 offset-xl-2 dis-flex space-a px12 px-0 py-2">
                    <p class="m-0"> Este sitio se visualiza mejor en las versiones más recientes de los navegadores web
                        &nbsp;|&nbsp; Instituto Electoral Ciudad de México &nbsp;|&nbsp; UTSI {{version}} <small>dist[{{date_dist | date:'short'}}] </small> &nbsp;|&nbsp;
                    </p>
                    <div data-toggle="modal" data-target="#avisoPrivacidad"><i class="fa fa-question-circle"
                            style="cursor: pointer;" data-toggle="tooltip" title="" data-original-title="Consultar"></i>
                        Aviso de privacidad </div>
                    <p></p>

                </div>
            </div>
        </footer>
    </div>
</div>

<div id="avisoPrivacidad" tabindex="-1" role="dialog" aria-labelledby="avisoPrivacidadLabel" aria-hidden="true" class="modal fade">
    <div role="document" class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <div id="avisoPrivacidadLabel" style="color: #1d1f21de; font-weight: 600;" class="modal-title font-medium px16">Aviso de privacidad</div>
                <button type="button" data-dismiss="modal" aria-label="Close" class="close"><i class="fa fa-times-circle"></i></button>
            </div>
            <div class="modal-body px16 font-regular">
                <p>{{ avisoPrivacidadTexto }}</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
