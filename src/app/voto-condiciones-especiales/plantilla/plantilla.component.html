<app-plantilla-nivel [esperarAvanceEntidad]="false" [mostrarCombos]="false" [breadcrumbs]="configuracionBreadcrumbs">
    <div class="row py-4">
        <div class="col-12">
            <app-titulo-seccion>Votos en Actas Contabilizadas</app-titulo-seccion>
        </div>
    </div>
    <div class="contenedor-mapa" id="vista-mapa">
        <router-outlet></router-outlet>
    </div>
    <div class="container-fluid complemento-vista-mapa">
        <div class="row pb-4">
            <div class="col-10">
                <p class="font-medium px14">Por presentación, los decimales de los porcentajes muestran sólo cuatro
                    dígitos. No obstante, al considerar todos los decimales, suman 100%.</p>
            </div>
        </div>
    </div>

    <div class="container-fluid resumen-votacion">
        <app-resumen-votacion></app-resumen-votacion>
    </div>

    <div class="row" *ngIf="mostrarTablaActas && (actas$ | async) as estado">
        <app-tabla-actas [titulo]="tituloTablaActas" [estado]="estado"></app-tabla-actas>
    </div>
</app-plantilla-nivel>
