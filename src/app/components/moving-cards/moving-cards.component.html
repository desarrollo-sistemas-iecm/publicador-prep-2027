<div class="container-fluid d-none d-lg-block d-xl-block">
    <div class="row dis-flex pb-1">
        <div class="boton-scroll dis-flex cursorPointer">
            <i aria-hidden="true" class="fa fa-chevron-left"></i>
        </div>
        <div class="col-11">
            <div class="row dis-flex justify-s scrollH">
                <div class="col-6 col-sm-4 col-md-3 col-lg-2 px-1" *ngFor="let item of cards">
                    <!-- <pre>{{ item | json }}</pre> -->
                    <div class="card-resumen">
                        <div class="encabezado dis-flex w-100 py-2">
                            <div class="dis-flex w-100">
                                <b>{{item.siglas}}</b>
                                <div class="row w-100 dis-flex">
                                    <p class="pe p-1" ng-reflect-ng-style="[object Object]"
                                        style="background-image: url('./assets/img/unknow/{{item.siglas | remplazaGuionesMediosABajos}}.png'); background-size: contain; background-repeat: no-repeat; background-position: center center; margin: 20px 2px;">
                                    </p>
                                </div>
                            </div>
                        </div>
                        <div class="cuerpo dis-flex bgGrisTenue p-2">
                            <div class="w-50">
                                <p>Votos</p>
                                <p class="votos"><strong>{{item.total_votos | number}}</strong>
                                </p>
                            </div>
                            <div class="w-50 dis-flex flex-col align-e pr-3 pr-xl-0">
                                <p>Porcentaje</p>
                                <p>{{item.porcentaje}}%</p>
                            </div>
                        </div>
                    </div>
                </div>
