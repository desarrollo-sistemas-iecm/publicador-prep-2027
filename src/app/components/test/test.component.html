<app-plantilla-nivel [esperarAvanceEntidad]="false">
    <app-resultados-nivel [titulo]="labelSubtituloSeccion">
        <app-votos-actas-contabilizadas *ngIf="esVistaMapa"></app-votos-actas-contabilizadas>
    </app-resultados-nivel>

    <app-modadlidad-votos despuesDeTarjeta
        [mostrarCardVotoExtranjero]="tipoEleccion !== 'alcaldias'"></app-modadlidad-votos>

    <ng-container ngProjectAs="[secciones]">
        <div class="container-fluid estadisticaNacional py-3">
            <app-estadistica></app-estadistica>
        </div>
    </ng-container>
</app-plantilla-nivel>
