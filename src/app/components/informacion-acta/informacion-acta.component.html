<div class="container-fluid pb-3">
    <app-titulo-seccion>
        Información del Acta
        <span complemento *ngIf="estado">- <span [ngClass]="estado.claseColor">{{ estado.etiqueta }}</span></span>
    </app-titulo-seccion>
    <div class="row align-items-end">
        <div class="col-12 col-md-3 mb-2">
            <p class="px14 mb-1"><strong>Acta digitalizada</strong></p>
            <button type="button" class="boton-ver" [disabled]="!puedeVerActa" (click)="visorAbierto = true"
                [title]="puedeVerActa ? '' : 'La imagen del acta aún no está disponible'"
                [attr.aria-label]="'Ver acta digitalizada' + (origen ? ', ' + origen.etiqueta : '')">
                <app-iconos-origen-acta [iconos]="iconosVer"></app-iconos-origen-acta>
                Ver
            </button>
        </div>
        <div class="col-12 col-md-9 mb-2">
            <app-leyenda-origen-acta></app-leyenda-origen-acta>
        </div>
    </div>
</div>

<app-visor-acta *ngIf="visorAbierto && acta" [acta]="acta" [columnas]="columnas" [tipoEleccion]="tipoEleccion"
    (cerrar)="visorAbierto = false"></app-visor-acta>
