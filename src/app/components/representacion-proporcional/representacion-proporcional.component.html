<app-plantilla-nivel [mostrarAvance]="false" [mostrarCombos]="false" [breadcrumbs]="configuracionBreadcrumbs">
    <div class="row py-4">
        <div class="col-12">
            <app-titulo-seccion>Votos en Actas Contabilizadas</app-titulo-seccion>
        </div>
    </div>

    <div class="container-fluid resumen-votacion">
        <app-resumen-votacion></app-resumen-votacion>
    </div>

    <div class="row" *ngIf="actasRp$ | async as estado">
        <app-tabla-actas titulo="Actas de Representación Proporcional (RP)" [estado]="estado"></app-tabla-actas>
    </div>
</app-plantilla-nivel>
