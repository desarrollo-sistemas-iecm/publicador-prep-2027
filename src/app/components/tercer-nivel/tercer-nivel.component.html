<app-plantilla-nivel>
    <div class="row pt-4">
        <app-informacion-acta class="w-100"></app-informacion-acta>
    </div>
    <app-contenedor-resultados-dinamico></app-contenedor-resultados-dinamico>

    <div class="container-fluid resumen-votacion pt-4">
        <div class="row">
            <div class="col-12 col-xl-9">
                <app-resumen-votacion></app-resumen-votacion>
            </div>
            <div class="col-12 col-xl-3 mt-3 mt-xl-0">
                <app-observaciones-casilla></app-observaciones-casilla>
            </div>
        </div>
    </div>

    <ng-container ngProjectAs="[secciones]">
        <div class="container-fluid estadisticaNacional py-3">
            <app-estadistica-casillas></app-estadistica-casillas>
        </div>

        <div class="container-fluid" *ngIf="prep">
            <app-observaciones-en-acta id="leyenda-observaciones-en-acta"></app-observaciones-en-acta>
        </div>
    </ng-container>
</app-plantilla-nivel>
